[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redapple"
version = "0.3.0"
description = "RED APPLE v0.3 research workbench"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["ra", "ra.srf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP007", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
