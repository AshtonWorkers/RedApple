name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: make lint
      - name: Mypy strict
        run: make typecheck PYTHON=python
      - name: Tests
        run: make test PYTHON=python
      - name: Coverage floors
        run: make coverage PYTHON=python
